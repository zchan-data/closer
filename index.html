<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="description" content="A shared deck of conversation cards for two people across the distance.">
<title>closer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* ─────────────────────────────  tokens  ───────────────────────────── */
:root{
  --bg-0:#07060f;
  --ink:#f4efe6;
  --ink-soft:#b6adcf;
  --ink-faint:#8c84ab;   /* 5.5:1 on the page, 4.6:1 on the glass card */

  --glass-line:rgba(255,255,255,.11);
  --accent-rgb:168,158,214;
  --accent:rgb(var(--accent-rgb));

  /* the three suit accents of the active deck, in picker order */
  --rail-a:242,197,124;
  --rail-b:167,139,250;
  --rail-c:251,113,133;

  --radius:28px;
  --flip:820ms;
  --ease:cubic-bezier(.62,.02,.34,1);

  --step-0:.6875rem;
  --step-1:.8125rem;
  --step-2:.9375rem;
}
/* --accent-rgb and the rail vars are set inline on <body> from the active deck,
   so a new deck or suit needs no rule here. data-cat survives only as the hook
   the aurora uses to tell "a card is face up" from "the deck is face down". */

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.5;
  background:
    radial-gradient(125% 75% at 50% -12%, #1d1440 0%, transparent 58%),
    radial-gradient(95% 55% at 12% 104%, #170f2e 0%, transparent 62%),
    var(--bg-0);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer}
:focus-visible{outline:2px solid rgba(var(--accent-rgb),.9);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ─────────────────────────────  night sky  ───────────────────────────── */
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stars{position:absolute;top:0;left:0;width:2px;height:2px;border-radius:50%;background:transparent;
  animation:drift linear infinite}
.stars--a{animation-duration:190s}
.stars--b{animation-duration:130s}
.stars--c{animation-duration:90s}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-1500px)}}

.aurora{
  position:absolute;left:50%;top:42%;width:min(820px,135vw);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    rgba(var(--accent-rgb),.22) 0%,
    rgba(var(--accent-rgb),.075) 34%,
    transparent 67%);
  filter:blur(26px);
  transition:background 1s ease,opacity 1s ease;
}
body[data-cat] .aurora{opacity:1}
.aurora{opacity:.55}

/* ─────────────────────────────  shell  ───────────────────────────── */
.shell{
  position:relative;z-index:1;
  width:min(560px,100%);
  margin-inline:auto;
  min-height:100svh;
  display:flex;flex-direction:column;
  gap:clamp(18px,3.4vh,30px);
  padding:calc(22px + env(safe-area-inset-top)) clamp(18px,5vw,28px) calc(22px + env(safe-area-inset-bottom));
}

/* ─────────────────────────────  masthead  ───────────────────────────── */
.masthead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.wordmark{
  margin:0;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:300;font-style:italic;
  font-size:clamp(2.5rem,11vw,3.4rem);
  line-height:1;letter-spacing:.06em;
  color:var(--ink);
}
.tagline{
  margin:0;font-size:var(--step-0);letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);
}
.status{
  display:inline-flex;align-items:center;gap:7px;
  font-size:var(--step-0);letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);
  padding:5px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.028);
}
.status__dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none;transition:background .4s}
.status[data-state="live"]{color:var(--ink-soft)}
.status[data-state="live"] .status__dot{background:#6ee7a8;box-shadow:0 0 0 3px rgba(110,231,168,.16)}
.status[data-state="off"]{color:#f0a58c}
.status[data-state="off"] .status__dot{background:#f0a58c}

/* ─────────────────────────────  deck switch  ───────────────────────────── */
.deckbar{
  display:inline-flex;gap:4px;margin-top:2px;
  padding:4px;border-radius:999px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.028);
}
.deckbtn{
  display:inline-flex;align-items:baseline;gap:7px;
  padding:7px 15px;border-radius:999px;
  font-size:var(--step-0);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);
  transition:color .22s ease,background .22s ease,box-shadow .22s ease;
}
.deckbtn__n{font-variant-numeric:tabular-nums;letter-spacing:.06em;opacity:.62}
.deckbtn[aria-pressed="true"]{
  color:var(--ink);
  background:rgba(var(--accent-rgb),.14);
  box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.34);
}
@media (hover:hover){
  .deckbtn:hover:not([aria-pressed="true"]){color:var(--ink-soft);background:rgba(255,255,255,.04)}
}

/* ─────────────────────────────  the card  ───────────────────────────── */
/* The card takes whatever height the viewport has left over, so the footer is
   never pushed off screen on short phones. */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}
.scene{position:relative;perspective:1600px;flex:1;min-height:296px;max-height:540px}
.card{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform var(--flip) var(--ease);
  will-change:transform;
}
.face{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  border-radius:var(--radius);
  border:1px solid var(--glass-line);
  background:linear-gradient(158deg,rgba(255,255,255,.085) 0%,rgba(255,255,255,.022) 62%,rgba(255,255,255,.045) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(130%);
  backdrop-filter:blur(16px) saturate(130%);
  box-shadow:
    0 34px 70px -34px rgba(0,0,0,.9),
    0 24px 90px -50px rgba(var(--accent-rgb),.85),
    inset 0 1px 0 rgba(255,255,255,.08);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
}
.face::after{ /* top sheen */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 55% at 50% -18%,rgba(var(--accent-rgb),.16),transparent 70%);
}
.face--q{transform:rotateY(180deg)}

/* face: cover */
.face--cover{align-items:center;justify-content:center;gap:22px;padding:32px;text-align:center}
.crest{width:88px;height:88px;color:rgba(var(--accent-rgb),.85);opacity:.9}
.cover__hint{margin:0;font-size:var(--step-1);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.cover__sub{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:1.25rem;color:var(--ink-soft)}

/* face: question */
.face--q{padding:clamp(24px,6vw,34px);gap:18px;justify-content:space-between}
.q__head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q__cat{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--step-0);letter-spacing:.2em;text-transform:uppercase;
  color:rgb(var(--accent-rgb));
}
.q__cat svg{width:15px;height:15px;flex:none}
.q__chip{
  font-size:var(--step-0);letter-spacing:.18em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;
  color:rgb(var(--accent-rgb));
  border:1px solid rgba(var(--accent-rgb),.4);
  background:rgba(var(--accent-rgb),.1);
}
.q__text{
  margin:0;flex:1;display:flex;align-items:center;
  font-family:"Cormorant Garamond",Georgia,serif;
  font-weight:400;line-height:1.28;letter-spacing:.005em;
  font-size:clamp(1.6rem,6.6vw,2.15rem);
  color:var(--ink);
  text-wrap:balance;
}
.q__text[data-len="long"]{font-size:clamp(1.4rem,5.6vw,1.85rem)}
.q__text[data-len="xlong"]{font-size:clamp(1.22rem,4.8vw,1.6rem);line-height:1.34}
.q__foot{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:var(--step-0);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.q__foot::before{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(var(--accent-rgb),.45),transparent)}

/* byline under the card */
.byline{
  margin:0;text-align:center;min-height:1.2em;
  font-size:var(--step-0);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
  transition:opacity .35s ease;
}
.byline b{color:var(--ink-soft);font-weight:500}

/* ─────────────────────────────  category picker  ───────────────────────────── */
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  min-height:88px;padding:14px 8px 12px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.035);
  transition:transform .22s var(--ease),background .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.pick svg{width:20px;height:20px;color:rgb(var(--accent-rgb));transition:transform .22s var(--ease)}
.pick__name{font-size:var(--step-0);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.3}
.pick__count{font-size:var(--step-0);color:var(--ink-faint);letter-spacing:.06em}
.pick__count b{color:rgba(var(--accent-rgb),.9);font-weight:500;font-variant-numeric:tabular-nums}
@media (hover:hover){
  .pick:hover:not(:disabled){
    transform:translateY(-3px);
    background:rgba(var(--accent-rgb),.1);
    border-color:rgba(var(--accent-rgb),.42);
    box-shadow:0 14px 30px -18px rgba(var(--accent-rgb),.9);
  }
  .pick:hover:not(:disabled) svg{transform:scale(1.12)}
}
.pick:active:not(:disabled){transform:translateY(-1px) scale(.975)}
.pick[aria-pressed="true"]{background:rgba(var(--accent-rgb),.13);border-color:rgba(var(--accent-rgb),.5)}
.pick:disabled{opacity:.34;cursor:not-allowed}
.busy{pointer-events:none}
.busy .pick{opacity:.55}

/* ─────────────────────────────  footer  ───────────────────────────── */
.footer{display:flex;flex-direction:column;gap:12px;align-items:center}
.rail{width:100%;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.rail__fill{height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,rgba(var(--rail-a),.9),rgba(var(--rail-b),.9),rgba(var(--rail-c),.9));
  transition:width .6s var(--ease),background .5s ease}
.footer__row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:14px;
  font-size:var(--step-0);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.footer__row b{color:var(--ink-soft);font-weight:500;font-variant-numeric:tabular-nums}
.linkbtn{padding:6px 2px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase;font-size:var(--step-0);
  border-bottom:1px solid rgba(255,255,255,.14);transition:color .2s,border-color .2s}
.linkbtn:hover{color:var(--ink);border-color:rgba(var(--accent-rgb),.7)}

/* ─────────────────────────────  sheet + toast  ───────────────────────────── */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:22px;
  background:rgba(5,4,12,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .25s ease}
.sheet[hidden]{display:none}
.sheet.is-open{opacity:1}
.sheet__panel{
  width:min(380px,100%);padding:28px 26px 22px;border-radius:26px;text-align:center;
  border:1px solid var(--glass-line);
  background:linear-gradient(158deg,rgba(30,24,58,.96),rgba(14,11,32,.98));
  box-shadow:0 40px 80px -36px rgba(0,0,0,.9);
  transform:translateY(14px) scale(.97);transition:transform .3s var(--ease)}
.sheet.is-open .sheet__panel{transform:none}
.sheet__title{margin:0 0 8px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:1.7rem}
.sheet__body{margin:0 0 22px;font-size:var(--step-2);color:var(--ink-soft);line-height:1.55}
.sheet__acts{display:flex;flex-direction:column;gap:9px}
.btn{min-height:46px;border-radius:14px;font-size:var(--step-1);letter-spacing:.14em;text-transform:uppercase;
  border:1px solid transparent;transition:background .2s,border-color .2s,color .2s}
.btn--go{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.45);color:#ffc9d1}
.btn--go:hover{background:rgba(251,113,133,.26)}
.btn--off{color:var(--ink-faint)}
.btn--off:hover{color:var(--ink)}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,14px);
  max-width:min(420px,calc(100vw - 32px));
  padding:11px 18px;border-radius:999px;
  font-size:var(--step-1);color:var(--ink);text-align:center;
  border:1px solid var(--glass-line);
  background:rgba(26,20,50,.94);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 20px 40px -22px rgba(0,0,0,.9);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s var(--ease)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

@media (max-height:720px){
  .shell{gap:13px}
  .scene{min-height:224px}
  .wordmark{font-size:clamp(2rem,8vw,2.5rem)}
  .pick{min-height:74px;padding:11px 8px 10px}
  .deckbtn{padding:5px 12px}
}

@media (min-width:600px){
  .pick{min-height:96px}
  .pick__name{font-size:var(--step-1)}
}

@media (prefers-reduced-motion:reduce){
  .stars{animation:none}
  .card{transition:none!important}
  .face{transition:opacity .2s linear}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="stars stars--a" id="starsA"></div>
  <div class="stars stars--b" id="starsB"></div>
  <div class="stars stars--c" id="starsC"></div>
  <div class="aurora"></div>
</div>

<div class="shell">

  <header class="masthead">
    <div class="status" id="status" data-state="wait">
      <span class="status__dot"></span><span id="statusText">Connecting</span>
    </div>
    <h1 class="wordmark">closer</h1>
    <p class="tagline">A deck for two</p>
    <div class="deckbar" id="deckbar" role="group" aria-label="Deck"></div>
  </header>

  <main class="stage">
    <div class="scene">
      <div class="card" id="card">

        <section class="face face--cover" id="faceCover">
          <svg class="crest" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
            <circle cx="38" cy="48" r="20"/>
            <circle cx="58" cy="48" r="20"/>
            <circle cx="48" cy="48" r="31" stroke-dasharray="2 6" opacity=".55"/>
            <circle cx="48" cy="17" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="79" cy="48" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="48" cy="79" r="1.6" fill="currentColor" stroke="none"/>
            <circle cx="17" cy="48" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
          <p class="cover__sub" id="coverSub">The deck is face down.</p>
          <p class="cover__hint" id="coverHint">Choose a category</p>
        </section>

        <section class="face face--q" id="faceQ" aria-hidden="true">
          <div class="q__head">
            <span class="q__cat"><span id="qIcon"></span><span id="qCat"></span></span>
            <span class="q__chip" id="qChip" hidden>Dare</span>
          </div>
          <p class="q__text" id="qText"></p>
          <div class="q__foot"><span id="qLeft"></span></div>
        </section>

      </div>
    </div>
    <p class="byline" id="byline"></p>
    <p class="sr" role="status" aria-live="polite" id="live"></p>
  </main>

  <nav class="picker" id="picker" aria-label="Card categories"></nav>

  <footer class="footer">
    <div class="rail"><div class="rail__fill" id="railFill"></div></div>
    <div class="footer__row">
      <span><b id="drawnTotal">0</b> of <span id="totalCount">150</span> drawn</span>
      <button class="linkbtn" id="resetBtn" type="button">Reshuffle</button>
    </div>
  </footer>

</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-describedby="sheetBody">
    <h2 class="sheet__title" id="sheetTitle">Reshuffle everything?</h2>
    <p class="sheet__body" id="sheetBody"></p>
    <div class="sheet__acts">
      <button class="btn btn--go" id="sheetGo" type="button">Yes, reshuffle</button>
      <button class="btn btn--off" id="sheetNo" type="button">Never mind</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // 1. The decks. A suit owns its own name, accent, icon and cards, and a deck
    //    owns its suits, so adding either is a data change and nothing else.
    const DECKS = [{
      id: 'closer', name: 'Closer', rgb: '168,158,214',
      rail: ['242,197,124', '167,139,250', '251,113,133'],
      suits: [
      { id: 'stayClose', name: 'Stay Close', rgb: '242,197,124',
        icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="5.4" cy="12" r="2.6"/><circle cx="18.6" cy="12" r="2.6"/><path d="M8.6 12h6.8" stroke-dasharray="2 2.6"/></svg>',
        cards: [
        "What was the exact moment you realized you were falling for me?",
        "When you're having a stressful day, what’s the best way for me to comfort you from afar?",
        "What is a small, everyday habit of mine that you’ve noticed from our video calls?",
        "When we are apart, what specific memory of us do you replay in your head the most?",
        "How do you feel our communication has evolved since we first went long-distance?",
        "What is something you’ve been wanting to tell me, but haven't found the right moment for yet?",
        "What is your absolute favorite non-physical trait of mine?",
        "In what moments do you feel the most understood by me?",
        "What is something we completely disagree on that you actually appreciate about us?",
        "If you could teleport to me for exactly 10 minutes right now, how would we spend them?",
        "What was the hardest day of being long-distance for you, and what got you through it?",
        "How has loving me from a distance changed your perspective on what makes a relationship work?",
        "What do you think is our biggest shared strength as a couple right now?",
        "What is a song that instantly makes you think of me when it plays?",
        "What is one thing I do—without realizing it—that always makes you feel secure?",
        "What was the exact moment today when you wished I was right there with you?",
        "How do you usually ground yourself when the distance starts feeling overwhelming?",
        "What is a deeply held belief of yours that I have helped change or soften?",
        "Which of my friends or family members were you most nervous to meet virtually?",
        "What is something you’re currently struggling with that I can help carry the weight of?",
        "What is the most valuable lesson this long-distance experience is teaching us?",
        "When we are silent on a call while doing our own things, how does it make you feel?",
        "What is a boundary we’ve set in our relationship that you are really grateful for?",
        "How do you prefer me to apologize when I mess up from miles away?",
        "What is a specific trait of mine that you want to cultivate more of in yourself?",
        "When you describe me to people who haven't met me, what is the first thing you say?",
        "What is a fear about our relationship you used to have, but don't anymore?",
        "Which of your personal achievements are you most proud of since we started dating?",
        "What is a conversation we had early on that completely shifted how you saw me?",
        "If you could capture one feeling from our relationship in a bottle, what would it feel like?",
        "What is something I’ve told you about my past that made you love me more?",
        "How do you know when I’m genuinely happy just by looking at me on a screen?",
        "What is the most unexpected way we are similar?",
        "What is the most comforting thing I’ve ever said to you during a breakdown?",
        "What part of your daily routine do you feel is most 'ours' even though we are apart?",
        "What is something you used to be insecure about that I’ve helped you embrace?",
        "If you had to write a one-sentence summary of our relationship so far, what would it be?",
        "What is the best piece of advice you’ve ever received about making distance work?",
        "How do you recharge your emotional battery after a particularly tough week?",
        "What is a silly inside joke we have that makes absolutely no sense to anyone else?",
        "What is the most vulnerable you have ever felt with me?",
        "How has your definition of 'home' changed since we met?",
        "What is a small compromise you’ve made for us that you are actually happy about?",
        "When you wake up before I do, what are you usually thinking about?",
        "What is something I do that makes you feel instantly respected and heard?",
        "If we could only communicate via voice notes for a week, what would you miss most?",
        "What is a trait you’ve discovered about yourself through loving me?",
        "What is a moment where you felt entirely, completely proud of me?",
        "How do we complement each other’s weaknesses?",

    // 2. Lookups. Suit ids are unique across every deck, so a stored card only
    //    needs its suit id to render with the right name, icon and accent.
    const DECK = Object.fromEntries(DECKS.map(d => [d.id, d]));
    const SUIT = Object.fromEntries(DECKS.flatMap(d => d.suits.map(s => [s.id, s])));
    const FIRST = DECKS[0].id;
    const total = deck => deck.suits.reduce((n, s) => n + s.cards.length, 0);

    const $ = id => document.getElementById(id);

    if (!myId) { myId = Math.random().toString(36).slice(2, 10); localStorage.setItem('closer:me', myId); }

    // 4. Night sky
    function seedStars(node, count, spread, blur, alphaMax) {
      const w = Math.max(window.innerWidth, 1440), h = 1500, out = [];
      for (let i = 0; i < count; i++) {
        const x = Math.round(Math.random() * w), y = Math.round(Math.random() * h);
        const a = (Math.random() * alphaMax + 0.2).toFixed(2);
        out.push(`${x}px ${y}px ${blur} ${spread} rgba(226,224,255,${a})`);
        out.push(`${x}px ${y + h}px ${blur} ${spread} rgba(226,224,255,${a})`);
      }
      node.style.boxShadow = out.join(',');
    }
    function paintSky() {
      const density = Math.max(window.innerWidth, 1440) / 1440;
      seedStars($('starsA'), Math.round(190 * density), '-0.7px', '0',   0.45);
      seedStars($('starsB'), Math.round(90 * density),  '-0.3px', '0',   0.55);
      seedStars($('starsC'), Math.round(26 * density),  '0',      '3px', 0.6);
    }
    paintSky();
    let skyTimer;
    addEventListener('resize', () => { clearTimeout(skyTimer); skyTimer = setTimeout(paintSky, 400); });

    // 5. The flip
    let rotation = 0;          // multiples of 180deg
    let swapTimer = null;
    const showingQuestion = () => Math.abs((rotation / 180) % 2) === 1;

    function turn(target, fill) {
      const same = (target === 'q') === showingQuestion();
      if (same && target === 'cover') { fill(); return; }

      const delta = same ? 360 : 180;
      const dur = reduced ? 0 : (delta === 360 ? 1000 : 720);

      // A 180deg turn lands on the face that is currently hidden, so it is safe to
      // fill it up front. A 360deg turn re-uses the visible face, so the swap has
      // to wait for the halfway point, where the card is edge-on and invisible.
      if (!same) fill();

      rotation += delta;
      el.card.style.transitionDuration = dur + 'ms';
      el.card.style.transform = `rotateY(${rotation}deg)`;
      el.faceQ.setAttribute('aria-hidden', target === 'q' ? 'false' : 'true');
      el.faceCover.setAttribute('aria-hidden', target === 'q' ? 'true' : 'false');

      clearTimeout(swapTimer);
      if (same) swapTimer = setTimeout(fill, dur / 2);
    }

    // 6. Rendering
    // `state` is a deck node's saved deckState, or null when that deck has never
    // been played. Firebase drops empty arrays, so inside a node that does exist
    // a missing suit means "all drawn" — including the case where every suit is
    // drained and the deckState key disappears entirely, which is why a drawn-out
    // deck has to be passed as {} rather than null.
    function normalize(deck, state) {
      const out = {};
      for (const s of deck.suits) {
        out[s.id] = state
          ? (Array.isArray(state[s.id]) ? state[s.id].filter(t => typeof t === 'string') : [])
          : s.cards.slice();
      }
      return out;
    }

    // Where one deck's {currentCard, deckState} lives inside the shared root.
    function nodeFor(root, id) {
      if (root && root.decks && root.decks[id]) return root.decks[id];
      // Before there were two decks the state sat at the root, unnamespaced, and
      // it was always the first deck. Read it in place; the next draw rewrites
      // the root in the current shape and this branch stops being reachable.
      if (id === FIRST && root && !root.decks && (root.currentCard || root.deckState)) {
        return { currentCard: root.currentCard, deckState: root.deckState };

      return null;

    function remaining(deck, root) {
      const node = nodeFor(root, deck.id);
      const pools = normalize(deck, node ? (node.deckState || {}) : null);
      return deck.suits.reduce((n, s) => n + pools[s.id].length, 0);

    function relTime(ts) {

      const m = Math.floor((Date.now() - ts) / 60000);

      const h = Math.floor(m / 60);

      if (isDare) text = text.replace(/^action:\s*/i, '');

      el.qText.textContent = text;
      el.qText.dataset.len = text.length > 118 ? 'xlong' : text.length > 78 ? 'long' : 'short';

      const left = deck[card.category].length;
      el.qLeft.textContent = left === 0 ? 'last of this suit' : `${left} left in this suit`;
    }

    function fillCover() {
      document.body.removeAttribute('data-cat');
      document.body.style.setProperty('--accent-rgb', activeDeck.rgb);
      el.coverSub.textContent = `The ${activeDeck.name} deck is face down.`;
      el.coverHint.textContent = 'Choose a category';
    }

    function renderCounts(pools) {
      let left = 0;
      for (const s of activeDeck.suits) {
        const n = pools[s.id].length;
        left += n;
        const btn = el.picker.querySelector(`[data-cat="${s.id}"]`);
        btn.querySelector('.pick__count').innerHTML = `<b>${n}</b> left`;
        btn.disabled = n === 0;
        btn.setAttribute('aria-label', `${s.name}, ${n} card${n === 1 ? '' : 's'} left`);
      }
      const whole = total(activeDeck);
      const drawn = whole - left;
      el.drawnTotal.textContent = drawn;
      el.railFill.style.width = (drawn / whole * 100) + '%';
    }

    function renderDeckBar(root) {
      for (const btn of el.deckbar.children) {
        const d = DECK[btn.dataset.deck];
        const left = remaining(d, root);
        btn.setAttribute('aria-pressed', String(d.id === activeId));
        btn.querySelector('.deckbtn__n').textContent = left;
        btn.setAttribute('aria-label', `${d.name} deck, ${left} of ${total(d)} cards left`);
      }
    }

    // Swap the picker and the palette over to a deck.
    function mountDeck(deck) {
      activeId = deck.id;
      activeDeck = deck;
      document.body.dataset.deck = deck.id;
      document.body.style.setProperty('--rail-a', deck.rail[0]);
      document.body.style.setProperty('--rail-b', deck.rail[1]);
      document.body.style.setProperty('--rail-c', deck.rail[2]);
      el.totalCount.textContent = total(deck);
      el.picker.style.gridTemplateColumns = `repeat(${deck.suits.length},1fr)`;
      el.picker.textContent = '';
      for (const s of deck.suits) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pick';
        btn.dataset.cat = s.id;
        btn.style.setProperty('--accent-rgb', s.rgb);
        btn.setAttribute('aria-pressed', 'false');
        btn.innerHTML = `${s.icon}<span class="pick__name">${s.name}</span><span class="pick__count"><b>${s.cards.length}</b> left</span>`;
        btn.addEventListener('click', () => draw(s.id));
        el.picker.appendChild(btn);
      }
    }

    let activeId = FIRST;
    let activeDeck = DECK[FIRST];
    let localDeck = normalize(activeDeck, null);
    // Stands in for the shared root when there is no database to talk to.
    const soloRoot = { activeDeck: FIRST, decks: {} };
    let lastKey;                 // undefined until the first render
    let lastCard = null;

    function applyState(root) {
      const wanted = root && DECK[root.activeDeck] ? root.activeDeck : FIRST;
      if (wanted !== activeId) mountDeck(DECK[wanted]);

      const node = nodeFor(root, activeId);
      const pools = normalize(activeDeck, node ? (node.deckState || {}) : null);
      localDeck = pools;
      renderCounts(pools);
      renderDeckBar(root);

      const card = node && node.currentCard && node.currentCard.text ? node.currentCard : null;
      // The deck id is part of the key, so switching decks always counts as a
      // change and the card turns over to whatever the other deck was left on.
      const key = card ? `${activeId}|${card.category}|${card.text}|${card.at || ''}` : null;

      if (key !== lastKey) {
        lastKey = key;
        if (card) {
          turn('q', () => fillQuestion(card, pools));
          el.live.textContent = `${SUIT[card.category].name}: ${card.text}`;
        } else {
          turn('cover', fillCover);
        }
      } else if (card) {
        fillQuestion(card, pools);   // counts changed under an unchanged card
      } else {
        fillCover();
      }

      for (const b of el.picker.children) {
        b.setAttribute('aria-pressed', String(!!card && b.dataset.cat === card.category));
      }
      el.byline.innerHTML = card && card.by
        ? `<b>${card.by === myId ? 'You' : 'They'}</b> drew this &middot; ${relTime(card.at)}`
        : '';
      lastCard = card;
    }

    setInterval(() => {
      if (lastCard && lastCard.by) {
        el.byline.innerHTML = `<b>${lastCard.by === myId ? 'You' : 'They'}</b> drew this &middot; ${relTime(lastCard.at)}`;
      }
    }, 30000);

    // 7. Toast + confirmation sheet
    let toastTimer;
    function toast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add('is-on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.toast.classList.remove('is-on'), 4200);
    }

    let sheetReturn = null;
    function openSheet() {
      sheetReturn = document.activeElement;
      // Reshuffling is scoped to the deck on the table, so the copy has to name it.
      el.sheetTitle.textContent = `Reshuffle ${activeDeck.name}?`;
      el.sheetBody.textContent = `All ${total(activeDeck)} ${activeDeck.name} cards go back into the deck for both of you, and the card on the table is cleared. Your other deck is untouched.`;
      el.sheet.hidden = false;
      requestAnimationFrame(() => el.sheet.classList.add('is-open'));
      el.sheetGo.focus();
    }
    function closeSheet() {
      el.sheet.classList.remove('is-open');
      setTimeout(() => { el.sheet.hidden = true; }, 250);
      if (sheetReturn) sheetReturn.focus();
    }
    el.resetBtn.addEventListener('click', openSheet);
    el.sheetNo.addEventListener('click', closeSheet);
    el.sheet.addEventListener('click', e => { if (e.target === el.sheet) closeSheet(); });
    addEventListener('keydown', e => {
      if (e.key === 'Escape' && !el.sheet.hidden) closeSheet();
      if (el.sheet.hidden && !e.metaKey && !e.ctrlKey && e.key.length === 1) {
        const n = Number(e.key);
        const s = n >= 1 ? activeDeck.suits[n - 1] : null;
        if (s) draw(s.id);
      }
    });
    el.sheetGo.addEventListener('click', () => { closeSheet(); reshuffle(); });

    // 8. Deck switch, then the picker for whichever deck we open on
    for (const d of DECKS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'deckbtn';
      btn.dataset.deck = d.id;
      btn.setAttribute('aria-pressed', String(d.id === FIRST));
      btn.innerHTML = `<span>${d.name}</span><span class="deckbtn__n">${total(d)}</span>`;
      btn.addEventListener('click', () => switchDeck(d.id));
      el.deckbar.appendChild(btn);
    }
    mountDeck(DECK[FIRST]);

    // 9. Firebase
    let gameRef = null, db = null;
    try {
      const res = await fetch('/api/config');
      if (!res.ok) throw new Error('Config route returned ' + res.status);
      const cfg = await res.json();
      if (!cfg || !cfg.databaseURL) throw new Error('Config is missing databaseURL');
      db = getDatabase(initializeApp(cfg));
      gameRef = ref(db, 'sharedGame');
    } catch (err) {
      console.error('Firebase config unavailable:', err);
    }

    function setStatus(state, text) {
      el.status.dataset.state = state;
      el.statusText.textContent = text;
    }

    if (gameRef) {
      onValue(ref(db, '.info/connected'), snap => {
        setStatus(snap.val() ? 'live' : 'wait', snap.val() ? 'In sync' : 'Reconnecting');
      });
      onValue(gameRef, snap => applyState(snap.val()), err => {
        console.error(err);
        setStatus('off', 'Sync error');
        toast('Lost the connection to your shared deck.');
      });
    } else {
      setStatus('off', 'Solo');
      applyState(soloRoot);
      toast('Playing solo — this device is not synced to your partner.');
    }

    // 10. Actions
    let busy = false;

    // Which deck is on the table is itself shared, so you both turn over the
    // same cards instead of quietly reading out of different decks.
    function switchDeck(id) {
      if (busy || id === activeId || !DECK[id]) return;
      if (!gameRef) { soloRoot.activeDeck = id; applyState(soloRoot); return; }
      set(ref(db, 'sharedGame/activeDeck'), id)
        .catch(err => { console.error(err); toast('Could not switch decks right now.'); });
    }

    async function draw(category) {
      if (busy) return;
      if (localDeck[category].length === 0) {
        toast(`${SUIT[category].name} is empty. Reshuffle to bring it back.`);
        return;
      }

      const deckId = activeId, deckMeta = activeDeck;
      busy = true;
      document.body.classList.add('busy');
      try {
        if (!gameRef) {
          const pool = localDeck[category];
          const text = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
          soloRoot.decks[deckId] = { currentCard: { category, text, by: myId, at: Date.now() }, deckState: localDeck };
          applyState(soloRoot);
          return;
        }

        // A transaction, so two simultaneous draws can't clobber each other's deck.
        // It runs on the whole root rather than this deck's node so that the other
        // deck's progress and any pre-namespace state are carried over by hand.
        const result = await runTransaction(gameRef, current => {
          const node = nodeFor(current, deckId);
          const pools = normalize(deckMeta, node ? (node.deckState || {}) : null);
          const pool = pools[category];
          // Abort (rather than commit an unchanged value) so `committed` comes
          // back false and the caller can say the suit ran out. Reachable only
          // if the other player drained it between our render and this click.
          if (!pool.length) return;
          const text = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];

          const decks = {};
          for (const other of DECKS) {
            if (other.id === deckId) continue;
            const kept = nodeFor(current, other.id);
            if (kept) decks[other.id] = kept;
          }
          decks[deckId] = { currentCard: { category, text, by: myId, at: Date.now() }, deckState: pools };

          const chosen = current && DECK[current.activeDeck] ? current.activeDeck : deckId;
          return { activeDeck: chosen, decks };
        }, { applyLocally: false });

        if (!result.committed) toast('That suit just ran out. Try another.');
      } catch (err) {
        console.error(err);
        toast('Could not reach the deck. Check your connection.');
      } finally {
        busy = false;
        document.body.classList.remove('busy');
      }
    }

    function reshuffle() {
      const deckId = activeId, name = activeDeck.name, count = total(activeDeck);
      if (gameRef) {
        // Rewriting the root rather than deleting one node, because dropping the
        // last node would take `decks` with it and let nodeFor fall back to the
        // pre-namespace state sitting at the root.
        runTransaction(gameRef, current => {
          const decks = {};
          for (const other of DECKS) {
            if (other.id === deckId) continue;
            const kept = nodeFor(current, other.id);
            if (kept) decks[other.id] = kept;
          }
          const chosen = current && DECK[current.activeDeck] ? current.activeDeck : deckId;
          return { activeDeck: chosen, decks };
        }, { applyLocally: false })
          .catch(err => { console.error(err); toast('Could not reshuffle right now.'); });
      } else {
        delete soloRoot.decks[deckId];
        applyState(soloRoot);
      }
      toast(`All ${count} ${name} cards are back in the deck.`);
    }
  </script>
</body>
</html>
